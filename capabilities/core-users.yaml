naftiko: 1.0.0-alpha2
info:
  label: Argus Enterprise Core API — Users
  description: 'Argus Enterprise Core API — Users. 2 operations. Lead operation: Argus Enterprise List Users. Self-contained
    Naftiko capability covering one Argus Enterprise business surface.'
  tags:
  - Argus Enterprise
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ARGUS_ENTERPRISE_API_KEY: ARGUS_ENTERPRISE_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-users
    baseUri: https://api.argusenterprise.com/v1
    description: Argus Enterprise Core API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: listusers
        method: GET
        description: Argus Enterprise List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users-userId
      path: /users/{userId}
      operations:
      - name: getuser
        method: GET
        description: Argus Enterprise Get a User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ARGUS_ENTERPRISE_API_KEY}}'
  exposes:
  - type: rest
    namespace: core-users-rest
    port: 8080
    description: REST adapter for Argus Enterprise Core API — Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listusers
        description: Argus Enterprise List Users
        call: core-users.listusers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{userid}
      name: users-userid
      description: REST surface for users-userId.
      operations:
      - method: GET
        name: getuser
        description: Argus Enterprise Get a User
        call: core-users.getuser
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Argus Enterprise Core API — Users. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: argus-enterprise-list-users
      description: Argus Enterprise List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-users.listusers
      outputParameters:
      - type: object
        mapping: $.
    - name: argus-enterprise-get-user
      description: Argus Enterprise Get a User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-users.getuser
      outputParameters:
      - type: object
        mapping: $.
