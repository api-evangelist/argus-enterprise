    description: Argus Enterprise Core API — Properties business capability. Self-contained, no shared references.
    resources:
    - name: properties
      path: /properties
      operations:
      - name: listproperties
        method: GET
        description: Argus Enterprise List Properties
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: portfolioId
          in: query
          type: string
          description: Filter by portfolio identifier
        - name: propertyType
          in: query
          type: string
          description: Filter by property type
        - name: status
          in: query
          type: string
          description: Filter by property status
      - name: createproperty
        method: POST
        description: Argus Enterprise Create a Property
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: properties-propertyId
      path: /properties/{propertyId}
      operations:
      - name: getproperty
        method: GET
        description: Argus Enterprise Get a Property
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateproperty
        method: PUT
        description: Argus Enterprise Update a Property
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteproperty
        method: DELETE
        description: Argus Enterprise Delete a Property
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ARGUS_ENTERPRISE_API_KEY}}'
  exposes:
