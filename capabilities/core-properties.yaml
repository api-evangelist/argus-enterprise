      outputParameters:
      - type: object
        mapping: $.
    - name: argus-enterprise-update-property
      description: Argus Enterprise Update a Property
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: core-properties.updateproperty
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: argus-enterprise-delete-property
